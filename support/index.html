<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支持開發 · shu</title>
<meta name="description" content="贊助 shu（yehshune）的開源專案（PoeXD 等）。Support yehshune's open-source projects.">
<link rel="icon" href="../assets/poexd/logo-300x300.png">
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/theme.js"></script>
<style>
  .support { padding: 56px 0 72px; background: linear-gradient(180deg, var(--bg) 0%, var(--wash) 100%); min-height: calc(100vh - 61px); }
  .support .panel {
    max-width: 560px; margin: 0 auto; padding: 32px 28px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .support h1 { margin: 0 0 8px; font-size: 1.75rem; }
  .support .desc { margin: 0 0 24px; color: var(--muted); }
  .channels { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .channel {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 18px; border-radius: 10px; font-weight: 700; text-decoration: none;
    background: var(--accent); color: var(--accent-text);
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .channel:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .channel.kofi { background: #ff5e5b; color: #fff; }
  .channel svg { width: 26px; height: 26px; flex: none; }
  .qr-hint { margin: 28px 0 12px; font-size: 0.875rem; color: var(--muted); text-align: center; }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .qr-grid figure { margin: 0; padding: 12px; border: 1px solid var(--border); border-radius: 10px; text-align: center; }
  .qr-grid img { width: 100%; height: auto; border-radius: 6px; background: #fff; }
  .qr-grid figcaption { margin-top: 8px; font-weight: 600; font-size: 0.9375rem; }
  .lang { margin-top: 24px; font-size: 0.875rem; text-align: center; color: var(--muted); }
  .lang button { background: none; border: 0; padding: 0 6px; color: var(--accent); cursor: pointer; font: inherit; }
  .lang button[aria-pressed="true"] { color: var(--text); font-weight: 700; }
</style>
</head>
<body>
<nav class="nav" aria-label="主要導覽">
  <div class="wrap">
    <a class="brand" href="../">yeh<span>shune</span></a>
    <ul>
      <li><a class="link" href="../#works">作品</a></li>
      <li><a class="link" href="../poexd/">PoeXD 教學</a></li>
      <li class="hide-sm"><a class="link" href="./" aria-current="page">贊助</a></li>
      <li class="hide-sm"><a class="link" href="https://github.com/yehshune">GitHub</a></li>
    </ul>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="切換主題">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</nav>

<main class="support">
  <div class="wrap">
    <div class="panel">
      <h1 id="title"></h1>
      <p class="desc" id="desc"></p>
      <ul class="channels" id="channels"></ul>
      <p class="qr-hint" id="qr-hint"></p>
      <div class="qr-grid" id="qr-codes"></div>
      <div class="lang"><button type="button" data-lang="zh">中文</button>·<button type="button" data-lang="en">English</button></div>
    </div>
  </div>
</main>

<!-- Ko-fi 咖啡杯圖示（白色杯子＋紅色愛心），供按鈕使用 -->
<template id="icon-kofi">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <path fill="#fff" d="M4 9.5c0-.83.67-1.5 1.5-1.5h17c.83 0 1.5.67 1.5 1.5V11h1.5a4.5 4.5 0 0 1 0 9H23.6A8.5 8.5 0 0 1 15.5 26h-3A8.5 8.5 0 0 1 4 17.5v-8Zm20 4v4h1.5a2 2 0 0 0 0-4H24Z"/>
    <path fill="#ff5e5b" d="M14 22.2c-.2 0-.4-.07-.55-.2-2.9-2.43-4.45-3.9-4.45-5.75 0-1.38 1.07-2.45 2.4-2.45.92 0 1.9.53 2.6 1.4.7-.87 1.68-1.4 2.6-1.4 1.33 0 2.4 1.07 2.4 2.45 0 1.85-1.55 3.32-4.45 5.75-.15.13-.35.2-.55.2Z"/>
  </svg>
</template>

<script>
  // 新增贊助管道時只改這裡（並同步 yehshune/.github 的 FUNDING.yml）
  // icon：對應上方 <template id="icon-..."> 的名稱；className：按鈕額外樣式
  const CHANNELS = [
    { name: 'Ko-fi', url: 'https://ko-fi.com/shu540886', icon: 'kofi', className: 'kofi' },
  ];
  // 掃碼收款：圖片放在 support/ 目錄，name 依語系顯示
  const QR_CODES = [
    { name: { zh: '微信支付', en: 'WeChat Pay' }, src: 'wechat-pay.png' },
    { name: { zh: '支付寶', en: 'Alipay' }, src: 'alipay.png' },
  ];

  const TEXT = {
    zh: {
      lang: 'zh-Hant-TW',
      title: '支持開發',
      desc: '我的專案（例如 PoeXD）都免費且開源。如果它們幫你省下時間，歡迎透過以下管道贊助支持。',
      cta: (name) => `前往 ${name} 贊助`,
      qrHint: '或使用 App 掃描 QR Code（手機可長按圖片儲存，再從相簿掃描）',
      qrAlt: (name) => `${name}收款 QR Code`,
    },
    en: {
      lang: 'en',
      title: 'Support Development',
      desc: 'My projects, such as PoeXD, are free and open source. If they save you time, you can support their development below.',
      cta: (name) => `Support on ${name}`,
      qrHint: 'Or scan a QR code with the app (on mobile, save the image and scan it from your photos)',
      qrAlt: (name) => `${name} QR code`,
    },
  };

  function icon(name) {
    const tpl = name && document.getElementById(`icon-${name}`);
    return tpl ? tpl.content.firstElementChild.cloneNode(true) : null;
  }

  function render(key) {
    const t = TEXT[key];
    document.documentElement.lang = t.lang;
    document.getElementById('title').textContent = t.title;
    document.getElementById('desc').textContent = t.desc;
    document.getElementById('channels').replaceChildren(...CHANNELS.map((c) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = ['channel', c.className].filter(Boolean).join(' ');
      a.href = c.url;
      a.rel = 'noopener noreferrer';
      const svg = icon(c.icon);
      if (svg) a.append(svg);
      a.append(t.cta(c.name));
      li.append(a);
      return li;
    }));
    document.getElementById('qr-hint').textContent = t.qrHint;
    document.getElementById('qr-codes').replaceChildren(...QR_CODES.map((q) => {
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = q.src;
      img.width = 480;
      img.height = 480;
      img.loading = 'lazy';
      img.alt = t.qrAlt(q.name[key]);
      const cap = document.createElement('figcaption');
      cap.textContent = q.name[key];
      fig.append(img, cap);
      return fig;
    }));
    document.querySelectorAll('[data-lang]').forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.lang === key)));
  }

  const params = new URLSearchParams(location.search);
  const initial = params.get('lang') === 'en' || (!params.get('lang') && !/^zh/i.test(navigator.language)) ? 'en' : 'zh';
  document.querySelectorAll('[data-lang]').forEach((btn) => btn.addEventListener('click', () => render(btn.dataset.lang)));
  render(initial);
</script>
</body>
</html>
